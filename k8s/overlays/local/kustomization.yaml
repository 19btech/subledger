apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fyntrac
resources:
  - ../../base
# fyntrac-secrets (ZITADEL_ISSUER_URI, MONGODB_PSWD) is deliberately not managed here — it holds
# real credentials and is created imperatively from ~/.dev_profile via
# k8s/overlays/local/create-secret.sh, never committed to git.

# Mirrors fyntrac-data's mongo-init.js (copy it here again if that file changes) so the mongodb
# Deployment in ../../base can mount it without depending on the fyntrac-data repo's checkout path.
configMapGenerator:
  - name: mongo-init
    files:
      - mongo-init.js

