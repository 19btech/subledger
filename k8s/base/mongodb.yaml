apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: fyntrac
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:8.2
          # `args`, not `command` — command would override the image's ENTRYPOINT
          # (docker-entrypoint.sh), which is what applies --bind_ip_all and runs the
          # MONGO_INITDB_ROOT_* user bootstrap. Overriding it left mongod listening
          # only on 127.0.0.1 (unreachable from other pods, though the in-container
          # readiness probe still passed) and with no root user ever created.
          # Plan cache: the classic cache is capped only per collection (default 5000 entries);
          # a Hearst case left ~1,900 one-off shapes (~1.8MB each, 3.4GB) on the LTD collections
          # and mongod was OOMKilled. planCacheSize only bounds the SBE cache, so it doesn't help.
          # tcmallocReleaseRate (8.x: bytes/sec) returns freed memory to the OS; the 8.x
          # default of 0 kept RSS at its peak after every run.
          args: ["--wiredTigerCacheSizeGB", "1.5",
                 "--setParameter", "internalQueryCacheMaxEntriesPerCollection=100",
                 "--setParameter", "internalQueryCacheMaxSizeBytesBeforeStripDebugInfo=67108864",
                 "--setParameter", "tcmallocReleaseRate=20971520"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fyntrac-secrets
                  # NOT the MONGODB_PSWD key — that's URL-encoded for connection-string use
                  # (see create-secret.sh). This env var is consumed literally by
                  # docker-entrypoint.sh, so it needs the decoded MONGODB_PSWD_RAW or mongod's
                  # actual password won't match what every client decodes from the URI.
                  key: MONGODB_PSWD_RAW
            - name: MONGO_INITDB_DATABASE
              value: master
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d/mongo-init.js
              subPath: mongo-init.js
              readOnly: true
          readinessProbe:
            # A TCP check, not `mongosh --eval ping`: mongosh is a Node.js process whose
            # startup alone exceeded the probe timeout under batch load (87 failures in one
            # Hearst_VER run, 2026-09-30, even at timeoutSeconds 5), which pulled this only
            # pod out of the Service and made clients see "Connection refused" while mongod
            # itself was healthy. Accepting on 27017 is enough to mean mongod is serving.
            tcpSocket:
              port: 27017
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              # Must stay above --wiredTigerCacheSizeGB (1.5Gi) plus mongod's own
              # connection/journal overhead, or the scheduler under-provisions this pod
              # relative to what mongod actually needs.
              memory: "3Gi"
            limits:
              # 3Gi was too tight for --wiredTigerCacheSizeGB 1.5 plus mongod's working
              # set under load and repeatedly OOM-killed the container (exit 137), even
              # though the node itself had headroom to spare.
              # 5Gi still got OOM-killed twice in one Hearst_GHK run (2026-09-20, ~2h
              # apart) once the tenant reached ~10M LTD rows: measured just before a
              # kill, tcmalloc had 3.5Gi genuinely allocated -- 1.25Gi WiredTiger cache
              # plus ~2.2Gi of per-connection/per-operation memory for ~400 open
              # connections (two dataloader pods with a 300-connection tenant pool each).
              # Host has 31Gi with ~12Gi free; 8Gi leaves the cache + connections room.
              # Raised to 12Gi on the cluster; kept in sync here (2026-09-30).
              memory: "12Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongodb-data
        - name: mongo-init
          configMap:
            # Generated by k8s/overlays/local's configMapGenerator with disableNameSuffixHash, so
            # the name is literally "mongo-init" and this file can also be applied on its own
            # with `kubectl apply -f` (see the overlay's comment for why the hash was dropped).
            name: mongo-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-data
  namespace: fyntrac
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: fyntrac
spec:
  selector:
    app: mongodb
  # Single-replica database: never drop it from the endpoints because of a readiness blip.
  # A not-ready mongod still answers or fails fast, which clients retry; an empty endpoint
  # list turns every call into "Connection refused" and fails whole event-generation batches.
  publishNotReadyAddresses: true
  ports:
    - port: 27017
      targetPort: 27017
