spring.application.name=dataloader
server.port=8081
spring.profiles.active=test

# OAuth2 Resource Server - JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ZITADEL_ISSUER_URI:https://fyntrac-auth-mlmc7i.us1.zitadel.cloud}
# The dataloader will now accept tokens where the audience is either its own Client ID OR the Project ID
spring.security.oauth2.resourceserver.jwt.audiences=${ZITADEL_PROJECT_ID:368586804800002714}

spring.servlet.multipart.enabled=true
# Stage 0 (k8s scaling strategy, docs/K8S_SCALING_STRATEGY.md): defaults (1MB file / 10MB request)
# reject a multi-million-row CSV before any app code runs. file-size-threshold streams anything
# above 10MB straight to disk instead of buffering it in memory.
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
spring.servlet.multipart.file-size-threshold=10MB

# Dataloader-specific batch commit chunk size for the large activity/transaction file loaders
# (TransactionsDataLoadConfig, TransactionActivityDataLoadConfig, InstrumentAttributeDataLoadConfig).
# Deliberately separate from common's shared fyntrac.chunk.size (used by gl/aggregation jobs) so
# tuning this for multi-million-row uploads doesn't change chunk sizing for unrelated jobs.
fyntrac.upload.chunk.size=1000

# Bounded executor backing the async upload endpoints (AsyncUploadOrchestrator). Kept small
# deliberately — this is per-pod concurrency; Stage 3 (docs/K8S_SCALING_STRATEGY.md) scales pod
# count for bursts rather than growing this pool.
fyntrac.upload.async.core-pool-size=2
fyntrac.upload.async.max-pool-size=4
fyntrac.upload.async.queue-capacity=50
#logging
logging.file=/home/uabbas/logs/dataloader-service.log
logging.level.root=INFO
logging.file.max-history=7
logging.file.max-size=10MB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.org.springframework=INFO
# Replace with your package
logging.level.com.fyntrac=DEBUG

##SConsumer configuration
spring.pulsar.consumer.subscription.name=fyntrac-dataloader

# Producer configuration
spring.pulsar.producer.topic-bookGLStaging=fyntrac-book-gl-staging
spring.pulsar.producer.topic-glReclass=fyntrac-gl-reclass
spring.pulsar.producer.topic-accounting-period-close=fyntrac-gl-accounting-period-close
spring.pulsar.producer.topic-execute-model=fyntrac-model-execution
spring.pulsar.producer.topic-execute-aggregation=fyntrac-aggregate-execution
pulsar.topic.execute.model=execute-model-topic


# Define the default schema type for JSON
spring.pulsar.defaults.type-mappings[0].messageType=com.fyntrac.common.dto.record.Records.GeneralLedgerMessageRecord
spring.pulsar.defaults.type-mappings[0].schema-info.schema-type=JSON

spring.pulsar.defaults.type-mappings[1].messageType=com.fyntrac.common.dto.record.Records.ReclassMessageRecord
spring.pulsar.defaults.type-mappings[1].schema-info.schema-type=JSON

spring.pulsar.defaults.type-mappings[2].messageType=com.fyntrac.common.dto.record.Records.AccountingPeriodCloseMessageRecord
spring.pulsar.defaults.type-mappings[2].schema-info.schema-type=JSON

spring.pulsar.defaults.type-mappings[3].messageType=com.fyntrac.common.dto.record.Records.ModelExecutionMessageRecord
spring.pulsar.defaults.type-mappings[3].schema-info.schema-type=JSON

spring.pulsar.defaults.type-mappings[4].messageType=com.fyntrac.common.dto.record.Records.ExecuteAggregationMessageRecord
spring.pulsar.defaults.type-mappings[4].schema-info.schema-type=JSON

spring.pulsar.defaults.type-mappings[5].messageType=com.fyntrac.common.dto.record.Records.InstrumentMessageRecord
spring.pulsar.defaults.type-mappings[5].schema-info.schema-type=JSON

spring.pulsar.producer.topic-execute-python-model=fyntrac-python-model-execution
spring.pulsar.consumer.topic-python-model-completion=fyntrac-python-model-completion

spring.pulsar.defaults.type-mappings[6].messageType=com.fyntrac.common.dto.record.Records.PythonModelExecutionMessageRecord
spring.pulsar.defaults.type-mappings[6].schema-info.schema-type=JSON

#logging
logging.level.org.apache.pulsar=DEBUG
logging.level.org.springframework.cloud=DEBUG