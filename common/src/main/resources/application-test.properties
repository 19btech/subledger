# Pulsar
spring.pulsar.client.service-url=pulsar://localhost:8080
# Schema compatibility configuration
spring.pulsar.schema.compatibility=FORWARD

#fyntrac
fyntrac.chunk.size=500
# Spring Batch chunk size for the file-upload steps (Mongo bulk write + cache flush
# per chunk). Separate from fyntrac.chunk.size, which pages model execution.
fyntrac.batch.chunk.size=500
fyntrac.thread.pool.size=10
# Max batches concurrently dispatched-and-awaiting-completion in ExcelModelService.
# generateEventAndDispatch (see its field comment) — matches dsl-model's replica count
# (k8s/base/dsl-model.yaml) so a large posting date doesn't dump every batch onto a fixed-size
# downstream pool at once.
fyntrac.batch.max-concurrent-dispatch=4
# Max instrument groups processed concurrently per page in ExcelModelService.
# generateEventAndDispatch (see its field comment) — keeps event generation from bursting wide
# enough to exhaust the tenant MongoDB connection pool (spring.data.mongodb.tenant-max-pool-size).
fyntrac.eventgen.max-concurrent-instrument-groups=50
# InstrumentAttribute ROWS per keyset page in ExcelModelService.generateEventAndDispatch (an
# instrument spans several rows, one per attributeId). Only one page is live in heap at a time and
# per-instrument work is capped by max-concurrent-instrument-groups above, so this trades a
# little memory for far fewer Mongo round trips + Event.saveAll calls on large tenants. Was tied
# to fyntrac.chunk.size (500), which is shared with the LTD/GL batch chunk sizes.
fyntrac.eventgen.page-size=2000
# Max instruments per model-service dispatch (one correlationId / one BatchCompletionWaiter
# timeout). Kept at the old page-derived size so a bigger page doesn't make each Python batch
# bigger; scale with the dsl-model pod's per-batch throughput, not with page-size.
fyntrac.batch.dispatch-batch-size=500
# Run-level stall guard for batch dispatch: fail only if NO batch completes within this window
# (clock restarts on every completion). Replaces a fixed 30-minute cap on the whole run, which a
# multi-million-instrument tenant can't finish inside regardless of per-batch health.
fyntrac.batch.dispatch-stall-timeout-minutes=30
# Per-tenant MongoClient connection pool size (TenantDatasourceConfig) — driver default is 100,
# which a live currentOp() check found pinned at exactly 100/100 in-use during event generation.
spring.data.mongodb.tenant-max-pool-size=300

#7200 is two hours
fyntrac.cache.timeout=17200

# Jackson date format for serialization and deserialization
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#fyntrac model
fyntrac.model.generate.model.output.file=true

#Virtual Thread
# Enable virtual threads
spring.threads.virtual.enabled=true

# Database connection pool (adjust based on your needs)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
